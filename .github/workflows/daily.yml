name: daily-shorts
on:
  schedule:
    # Checks every hour (GitHub skips some scheduled runs, so one check is not enough).
    # The "gap" step below only lets a run continue if the last post was >7.5h ago = ~3 posts/day.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Videos to make this run"
        default: "1"
permissions:
  contents: write
  actions: write
concurrency: daily-shorts
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gap check (scheduled runs only)
        id: gap
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(cat last_post.txt 2>/dev/null || echo 0)
            case "$last" in ''|*[!0-9]*) last=0 ;; esac
            now=$(date +%s)
            age=$(( now - last ))
            if [ "$age" -lt 27000 ]; then
              echo "Last post was $(( age / 60 )) min ago (< 450). Skipping this check."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-python@v5
        if: steps.gap.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - uses: denoland/setup-deno@v2
        if: steps.gap.outputs.skip != 'true'
        with:
          deno-version: v2.x
      - if: steps.gap.outputs.skip != 'true'
        run: command -v ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - if: steps.gap.outputs.skip != 'true'
        run: pip install -U -r requirements.txt
      - name: Make and upload
        if: steps.gap.outputs.skip != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          if [ -n "$YT_COOKIES_B64" ]; then printf '%s' "$YT_COOKIES_B64" | base64 -d > cookies.txt;
          elif [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi
          mkdir -p inbox output work
          python run.py daily --count "${{ inputs.count || '1' }}" --upload
      - name: Commit state (also counts as repo activity)
        if: always() && steps.gap.outputs.skip != 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          # add each file on its own: one missing file must not stop the others being staged
          for f in state.json template.json last_post.txt; do
            [ -f "$f" ] && git add -f "$f"
          done
          git commit -m "state: $(date -u +%F-%H)" || exit 0
          git pull --rebase -q || true
          git push
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable" || true
      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" -d "{\"content\":\"ShortsBot run failed: $RUN_URL\"}" "$WEBHOOK"
          fi