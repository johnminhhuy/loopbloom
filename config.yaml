# ShortsBot settings. Anything you leave out uses the built-in default (see shortsbot/config.py).

source:
  mode: reddit            # local (inbox/ folder) | reddit | youtube
  max_seconds: 60         # longer clips are skipped (never cut) - the whole clip is always used
  reddit:
    subreddits: [funny, Unexpected, instant_regret, nonononoyes, AnimalsBeingDerps]
    time: week
  youtube:
    queries: ["funny fail", "funny animals", "unexpected moment"]
    creative_commons_only: false

video:
  min_len: 6
  default_len: 15         # TrendWatcher overrides this with the trending median
  original_volume: 0.45   # the clip's own sound
  music_volume: 0.55
  sfx_volume: 1.0
  loop: auto              # auto | always | never

detect:
  use_gemini: false       # true = ask Gemini where the funny moment is (needs GEMINI_API_KEY)

upload:
  privacy: public         # unverified API projects are forced to private by YouTube until audited
  category_id: "23"       # 23 = Comedy
